<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site do Lohen</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e8eefc, #d5dcf5);
            font-family: Arial, sans-serif;
            color: #222;
        }

        .card {
            width: 90%;
            max-width: 550px;
            background-color: white;
            text-align: center;
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .foto-perfil {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #13146b;
            margin-bottom: 15px;
        }

        h1 {
            color: #13146b;
            margin: 10px 0;
            font-size: 30px;
        }

        h2 {
            color: #555;
            font-size: 19px;
            font-weight: normal;
            margin-bottom: 20px;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .botao {
            display: inline-block;
            background-color: #13146b;
            color: white;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 8px;
            font-weight: bold;
        }

        .botao:hover {
            background-color: #292bc4;
        }
    </style>
</head>

<body>

    <main class="card">

        <img 
            class="foto-perfil"
            src="imagens/linkedin.jpeg"
            alt="Foto de Lohen"
        >

        <h1>Olá, eu sou Lohen</h1>

        <h2>Estudante de Tecnologia e Programação</h2>

        <p>
            Estou aprendendo HTML e criando meu primeiro site
            no Visual Studio Code.
        </p>

         
<a  class="botao"
  href="https://wa.me/5534996592954"
  target="_blank"
  rel="noopener noreferrer"
>
  Falar comigo no WhatsApp
</a>
        </a>

    </main>

</body>
</html>
